<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctor Status — Home Visit Availability</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="plaque-wrap">
    <div class="hero-copy" aria-hidden="true">
      <span class="hero-kicker">COMMUNITY HEALTH · VILLAGE CARE</span>
      <h2>Doctor availability, at a glance.</h2>
      <p>Check the latest status before planning a visit.</p>
    </div>

    <div class="pin"></div>
    <section class="plaque" aria-live="polite">
      <div class="card-badge">LIVE STATUS</div>
      <div class="doctor-avatar" aria-hidden="true">✚</div>
      <h1 class="doctor-name" id="doctorName">Mavuduri Rambabu</h1>
      <p class="doctor-specialty" id="doctorSpecialty"></p>

      <hr class="divider" />

      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">స్థితిని లోడ్ చేస్తోంది…</span>
      </div>
      <p class="status-updated" id="statusUpdated">&nbsp;</p>
      <p class="status-note" id="statusNote"></p>

      <div class="plaque-footer" id="plaqueFooter"></div>
    </section>
    <a class="admin-link" href="admin.html">Staff sign in</a>
    <p class="footer-caption">Serving patients in and around the village.</p>
  </main>

  <script type="module" src="js/app.js?v=20260905"></script>
</body>
</html>
