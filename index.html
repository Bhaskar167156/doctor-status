<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>డాక్టర్ స్థితి — ఇంటి సందర్శన అందుబాటు</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="plaque-wrap">
    <div class="pin"></div>
    <div class="plaque">
      <h1 class="doctor-name serif" id="doctorName">డా. —</h1>
      <p class="doctor-specialty" id="doctorSpecialty">&nbsp;</p>

      <hr class="divider" />

      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label serif" id="statusLabel">లోడ్ అవుతోంది…</span>
      </div>
      <p class="status-updated" id="statusUpdated">&nbsp;</p>
      <p class="status-note" id="statusNote"></p>

      <div class="plaque-footer" id="plaqueFooter"></div>
    </div>
    <a class="admin-link" href="admin.html">సిబ్బంది సైన్ ఇన్</a>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
