<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Update Doctor Status — Staff</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="admin-wrap">
    <div class="admin-card" id="loginCard">
      <div class="card-badge">STAFF PORTAL</div>
      <h1 class="admin-title">Staff sign in</h1>
      <p class="admin-sub">Sign in to update the doctor's current availability.</p>

      <label class="field-label" for="username">Username</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" />

      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" />

      <p class="error-text" id="loginError"></p>
      <button class="btn-primary" id="loginBtn">Sign in</button>
    </div>

    <div class="admin-card hidden" id="updateCard">
      <div class="card-badge">LIVE STATUS</div>
      <h1 class="admin-title">Update availability</h1>
      <p class="admin-sub">Choose the doctor's current status.</p>

      <label class="field-label" for="statusSelect">Current status</label>
      <select id="statusSelect">
        <option value="" disabled selected>Select a status</option>
        <option value="available">🟢 Available at home</option>
        <option value="busy">🟠 Busy — seeing a patient</option>
        <option value="home_visit">🔵 On another home visit</option>
        <option value="clinic">🟣 At the clinic</option>
        <option value="away">⚪ Not in the village</option>
        <option value="leave">⚫ On leave</option>
      </select>

      <label class="field-label" for="note">Note for patients (optional)</label>
      <textarea id="note" rows="2" placeholder="e.g. Returning at 6:00 PM"></textarea>

      <p class="error-text" id="saveError"></p>
      <button class="btn-primary" id="saveBtn">Save status</button>

      <p class="admin-meta" id="lastSaved">&nbsp;</p>
      <button class="logout-link" id="logoutBtn">Sign out</button>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
